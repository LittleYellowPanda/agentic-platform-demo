# nginx in the frontend container: serves the React app, and forwards /api to the
# backend. With VITE_API_URL=/api (public deployment), the browser talks to ONE
# origin: no CORS, and nothing hardcodes localhost:8000 in the built JavaScript.
# The local setup (VITE_API_URL=http://localhost:8000) keeps working unchanged.

# --- Who is calling? ----------------------------------------------------------------
# Behind Cloudflare Access, every request carries the friend's verified email: limit
# per person. Without it (local use), fall back to the IP address.
# The header can only be trusted because, in the public setup, nothing but the
# Cloudflare tunnel can reach this container (no port published to the network).
map $http_cf_access_authenticated_user_email $client_key {
    ""      $remote_addr;
    default $http_cf_access_authenticated_user_email;
}

# Only POST (= start a run) counts against the run limit; an empty key is not limited.
map $request_method $run_key {
    POST    $client_key;
    default "";
}

# --- Rate limits ----------------------------------------------------------------------
# Runs cost LLM requests (about 3 per run): 5 per minute per person, short bursts allowed.
limit_req_zone $run_key    zone=runs:10m rate=5r/m;
# Everything else: generous, just a guard against loops and scripts.
limit_req_zone $client_key zone=api:10m  rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;

    # Below the backend's own 20 MB limit: refuse big uploads before they cross the tunnel
    client_max_body_size 10m;

    # FastAPI-style JSON errors, so the frontend shows a readable message, not HTML
    error_page 429 = @too_many_requests;
    error_page 413 = @too_large;

    location @too_many_requests {
        default_type application/json;
        return 429 '{"detail": "Too many requests. Wait a minute and try again."}';
    }

    location @too_large {
        default_type application/json;
        return 413 '{"detail": "File too large for this demo (10 MB max)."}';
    }

    # The React app: any unknown path serves index.html (client-side screens)
    location / {
        try_files $uri /index.html;
    }

    # Agent runs, including the SSE stream (regex locations win over /api/ below)
    location ~ ^/api/agents/\d+/runs {
        limit_req zone=runs burst=3 nodelay;
        limit_req zone=api burst=40 nodelay;

        rewrite ^/api/(.*)$ /$1 break;  # the backend's routes have no /api prefix
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_buffering off;      # SSE: pass each event through immediately
        proxy_cache off;
        proxy_read_timeout 300s;  # a run can wait a long time for the LLM
    }

    # The rest of the API
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://backend:8000/;  # trailing slash: /api/x is sent as /x
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
