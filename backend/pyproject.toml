[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "pypdf>=6.21.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
